<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCOPE — SRO Centralised Operations, Performance &amp; Efficiency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2545; --navy-2:#13315c; --navy-3:#1d4273; --gold:#c9a227; --gold-soft:#f6efd8;
  --bg:#f4f6f9; --surface:#ffffff; --surface-1:#fcfcfb; --line:#e3e7ee; --line-2:#eef1f5;
  --ink:#0f1b2d; --ink-2:#4a5568; --ink-3:#7a8699;
  --s1:#86b6ef; --s2:#5598e7; --s3:#2a78d6; --s4:#1c5cab; --s5:#0d366b; --gugur:#a3a29c; --kosong:#d9dde3;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --r:12px; --shadow:0 1px 2px rgba(15,27,45,.06),0 4px 16px rgba(15,27,45,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--s4)}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-hero{background:linear-gradient(150deg,var(--navy) 0%,var(--navy-2) 60%,var(--navy-3) 100%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-hero:after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(201,162,39,.12)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px}
.brand small{display:block;opacity:.7;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
.login-hero h1{font-size:44px;line-height:1.08;margin:0 0 14px;font-weight:800;letter-spacing:-.5px}
.login-hero h1 span{color:var(--gold)}
.login-hero p{max-width:460px;opacity:.82;font-size:15px}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hero-pills span{border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 12px;font-size:12px}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px}
.login-card{width:100%;max-width:420px}
.login-card h2{margin:0 0 4px;font-size:22px}
.login-card .sub{color:var(--ink-2);margin-bottom:24px}
.role-opt{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;transition:.15s}
.role-opt:hover{border-color:var(--s3);box-shadow:var(--shadow)}
.role-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;flex:none}
.role-opt b{display:block}
.role-opt small{color:var(--ink-2)}
.proto-note{margin-top:18px;font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:12px}

/* ---------- SHELL ---------- */
#app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cfd8e6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);color:#fff}
.nav-sec{padding:14px 12px 4px;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:#7f93b3;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 8px;border-radius:8px;color:#cfd8e6;text-decoration:none;cursor:pointer;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:rgba(201,162,39,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav a .ext{margin-left:auto;font-size:11px;opacity:.6}
.nav a .cnt{margin-left:auto;background:var(--gold);color:var(--navy);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.aside-foot{margin-top:auto;padding:14px 16px;font-size:11px;color:#7f93b3;border-top:1px solid rgba(255,255,255,.08)}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:5}
.crumb{color:var(--ink-3);font-size:12.5px}
.crumb b{color:var(--ink);font-size:15px;display:block}
.topbar .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:99px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.who small{display:block;color:var(--ink-3);font-size:11px;line-height:1}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff;cursor:pointer}
.bell i{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid #fff}
main{padding:24px 28px 60px;max-width:1400px}

/* ---------- COMPONENTS ---------- */
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:22px;letter-spacing:-.2px}
.page-h p{margin:2px 0 0;color:var(--ink-2)}
.page-h .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.card-h h3{margin:0;font-size:14.5px}
.card-h .sp{flex:1}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:1fr 1fr} .g21{grid-template-columns:2fr 1fr}
.kpi{padding:16px 18px}
.kpi .lbl{color:var(--ink-2);font-size:12.5px;font-weight:600}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px}
.kpi .meta{color:var(--ink-3);font-size:12px}
.kpi .bar{height:6px;border-radius:99px;background:var(--line-2);margin-top:10px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--s3);border-radius:99px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px}
a.btn{text-decoration:none;color:inherit}
.btn:hover{border-color:#c5ccd8}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.ok{background:#e9f7e9;border-color:#bfe6bf;color:#0a6b0a}
.btn.no{background:#fdeeee;border-color:#f3c4c4;color:#a32626}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:10px;width:max-content}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.inp:focus{outline:2px solid #b7d3f6;border-color:var(--s3)}
.search{min-width:240px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:700;color:var(--ink-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc;position:sticky;top:0}
.t td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#f7f9fc}
.tbl-wrap{max-height:620px;overflow:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2)}
.muted{color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge .dot{width:7px;height:7px;border-radius:50%}
.b-neutral{background:#f1f3f6;color:#4a5568}
.b-good{background:#eaf7ea;color:#0a6b0a}
.b-warn{background:#fff6e0;color:#8a5a00}
.b-crit{background:#fdeeee;color:#a32626}
.b-info{background:#eaf2fd;color:#1c5cab}
.b-gold{background:var(--gold-soft);color:#7a5f0d}
.stage-pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;white-space:nowrap}
.stage-pill i{width:10px;height:10px;border-radius:3px;flex:none}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
.flag{color:#8a5a00;font-size:11.5px;font-weight:600}

.kx{padding:16px 18px;border-top:4px solid var(--line);position:relative}
.kx .lbl{color:var(--ink-2);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.kx .val{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kx .val small{font-size:17px;color:var(--ink-3);font-weight:700}
.kx .meta{color:var(--ink-3);font-size:12px}
.kx.k-tot{border-top-color:var(--gold)} .kx.k-siap{border-top-color:var(--good)} .kx.k-avg{border-top-color:var(--gold)} .kx.k-risk{border-top-color:var(--crit)} .kx.k-gug{border-top-color:var(--gugur)} .kx.k-pel{border-top-color:#6250d6}
.kx.click{cursor:pointer} .kx.click:hover{box-shadow:0 2px 4px rgba(15,27,45,.08),0 8px 24px rgba(15,27,45,.08)}
.kx.sel{outline:2px solid var(--s3)}
.stage-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.stage-chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2)}
.stage-chips button i{width:9px;height:9px;border-radius:3px}
.stage-chips button.on{border-color:var(--s3);background:#eaf2fd;color:var(--ink)}
.stage-chips button b{color:var(--ink)}
.head-filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head-filters .lbl2{font-size:12px;color:var(--ink-3);font-weight:600}
/* stacked bars */
.stack-row{display:grid;grid-template-columns:70px 1fr 44px;gap:12px;align-items:center;margin:10px 0}
.stack{display:flex;height:26px;gap:2px}
.stack span{height:100%;position:relative;cursor:default}
.stack span:first-child{border-radius:4px 0 0 4px}
.stack span:last-child{border-radius:0 4px 4px 0}
.stack span:only-child{border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.hbar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 110px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
.hbar .track{height:14px}
.hbar .track i{display:block;height:100%;background:var(--s3);border-radius:0 4px 4px 0;min-width:2px}
.hbar>div{min-width:0}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hbar .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:260px}
#tip b{display:block}

/* list items */
.li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);align-items:flex-start}
.li:last-child{border-bottom:0}
.datebox{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.datebox b{display:block;font-size:17px;line-height:1.5}
.datebox small{display:block;background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:.6px;padding:1px 0}
.li .tt{font-weight:600}
.li .ss{color:var(--ink-3);font-size:12px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(11,37,69,.35);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(620px,100%);height:100%;background:#fff;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;background:#fff;z-index:1}
.drawer-h h2{margin:2px 0 0;font-size:17px;line-height:1.3}
.drawer-b{padding:18px 22px;flex:1}
.drawer-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.x{border:0;background:var(--line-2);width:32px;height:32px;border-radius:8px;cursor:pointer;flex:none;font-size:16px}
.modal-wrap{position:fixed;inset:0;background:rgba(11,37,69,.35);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(520px,100%);box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal .card-b{max-height:70vh;overflow:auto}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.fld .inp{width:100%}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px}
.dl dt{color:var(--ink-3);font-weight:600}
.dl dd{margin:0}
.stepper{display:flex;gap:4px;margin:6px 0 18px}
.stepper div{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.stepper div i{display:block;height:6px;border-radius:99px;background:var(--line-2);margin-bottom:5px}
.stepper div.on{color:var(--ink)}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.timeline .ev{position:relative;margin-bottom:12px;font-size:12.5px}
.timeline .ev:before{content:"";position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--s3)}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3);font-weight:700;margin:18px 0 8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:500}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{background:#fafbfc;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .dc{min-height:98px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;font-size:11px}
.cal .dc.out{background:#fafbfc;color:#c0c6d0}
.cal .dc .n{font-weight:700;font-size:12px;margin-bottom:3px}
.cal .dc.today .n{color:#fff;background:var(--crit);border-radius:99px;display:inline-block;padding:0 6px}
.ev-chip{display:block;border-radius:5px;padding:2px 5px;margin-bottom:3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev-ptp{background:#eaf2fd;color:#1c5cab;border-left:3px solid var(--s3)}
.ev-jrd{background:#fdf0ea;color:#a0451c;border-left:3px solid #eb6834}
.ev-tbc{border-style:dashed;opacity:.85}

/* ops */
.ops-tile{display:flex;gap:16px;padding:20px;align-items:flex-start}
.ops-ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.ops-ico svg{width:24px;height:24px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--good);font-weight:800}.no-{color:#c0c6d0}
.banner{border:1px solid #f0dfa8;background:#fffaf0;border-radius:10px;padding:10px 14px;color:#6b5512;font-size:12.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.prog{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;display:flex;gap:2px}
.prog i{display:block;height:100%}
.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.vchip{font-size:11px;border-radius:6px;padding:3px 7px;font-weight:600;border:1px solid var(--line)}
.vchip.done{background:#eaf7ea;border-color:#bfe6bf;color:#0a6b0a}
.vchip.plan{background:#eaf2fd;border-color:#cde2fb;color:#1c5cab}
.vchip.none{background:#fafbfc;color:var(--ink-3);border-style:dashed}
@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3,.g21{grid-template-columns:1fr}}
@media (max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto}#login{grid-template-columns:1fr}.login-hero{padding:32px}.g2,.g4{grid-template-columns:1fr}main{padding:16px}.topbar{padding:0 16px}}
@media print{aside,.topbar,.no-print{display:none!important}#app{display:block}}
/* ================= CORPORATE v1.1 ================= */
:root{--r:10px;--shadow:0 1px 2px rgba(16,24,40,.04);--bg:#f5f6f8;--line:#e4e7ec;--line-2:#eef0f3;--ink:#101828;--ink-2:#475467;--ink-3:#8a94a6}
body{font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);font-size:13.5px;letter-spacing:-.005em}
main{animation:fade .25s ease both;max-width:1360px;padding:28px 32px 60px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
.card-h{padding:14px 20px}.card-b{padding:16px 20px}
.card-h h3{font-size:14px;font-weight:600}
.page-h{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.page-h h1{font-size:20px;font-weight:600;letter-spacing:-.2px}
.page-h p{font-size:13px;color:var(--ink-3)}
.btn{border-radius:8px;font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn.pri{background:var(--navy);border-color:var(--navy)}
.btn.pri:hover{background:var(--navy-2)}
.inp{border-radius:8px}
.tabs{background:#eef0f3;border-radius:8px;padding:3px}.tabs button{border-radius:6px;font-weight:500;padding:5px 14px}
/* sidebar: flat, quiet */
aside{background:#0b2545;width:auto}
aside .brand{padding:22px 20px}
.nav-sec{color:#6b7f9e;font-weight:600;letter-spacing:1px;padding:18px 20px 6px}
.nav a{border-radius:6px;margin:1px 10px;padding:8px 12px;color:#c3cddb;font-weight:500;font-size:13px}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.active{background:rgba(255,255,255,.09);box-shadow:inset 2px 0 0 var(--gold);color:#fff}
.nav a .cnt{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.brand-mark{border-radius:8px;width:36px;height:36px;font-size:13px}
/* topbar */
.topbar{height:60px;padding:0 32px;background:#fff}
.crumb b{font-size:14px;font-weight:600}
.gsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#f9fafb;border-radius:8px;padding:7px 12px;min-width:300px;color:var(--ink-3);cursor:pointer;font-size:13px}
.gsearch:hover{border-color:#cfd4dc;background:#fff}
.gsearch kbd{margin-left:auto;font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:#fff}
.who{border:0;padding:0}
.bell{border:0;background:transparent}
/* KPI */
.kx{box-shadow:none}
.card.kx{border-top:3px solid var(--line)}

/* metric strip */
.mstrip{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:20px}
.mstrip .m{padding:20px 22px;border-right:1px solid var(--line-2);cursor:pointer;transition:background .15s}
.mstrip .m:last-child{border-right:0}

.mstrip .s{font-size:12.5px;color:var(--ink-2)}

.act{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.act:last-child{border-bottom:0}
.act .n{min-width:34px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:600;font-size:12.5px;background:#f2f4f7;color:var(--ink)}
.act .n.w{background:#fff6e0;color:#8a5a00}.act .n.c{background:#fdeeee;color:#a32626}
.act .ax{flex:1;min-width:0}.act .ax b{display:block;font-weight:500;font-size:13px}.act .ax span{font-size:12px;color:var(--ink-3)}
.act .arr{color:#c0c6d0}
.act:hover .arr{color:var(--ink)}
.t th{background:#f9fafb;font-weight:600;font-size:11px;color:var(--ink-3)}
.t td{padding:11px 12px}
.badge{font-weight:500}
.banner{border-radius:8px}
.toast{border-radius:8px}
/* palette */
.pal-wrap{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:80;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.pal{width:min(620px,94vw);background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:15px;outline:none}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-item{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer}

.pal-item .tt{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-item .ss{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-foot{display:flex;gap:14px;padding:8px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);background:#fafbfc}
@media (max-width:1100px){.mstrip{grid-template-columns:1fr 1fr}.gsearch{min-width:0}}

function wfBadge(w){

  return `<span class="badge ${m[w]||'b-neutral'}">${ic[w]||''} ${esc(w)}</span>`;
}
function parseTarikh(s){
  if(!s) return null;
  const m = s.match(/(\d{1,2})(?:\s*&\s*(\d{1,2}))?\s*(Jan|Feb|Mac|Apr|Mei|Jun|Jul|Ogo|Sep|Okt|Nov|Dis)\w*\s*(\d{4})/i);
  if(!m) return null;
  const mi = BULAN.findIndex(b=>b.toLowerCase()===m[3].slice(0,3).toLowerCase());
  const days=[+m[1]]; if(m[2]) days.push(+m[2]);
  return {days, m:mi, y:+m[4], tbc:/tbc/i.test(s)};
}
function sesiStatus(x){
  if(x.status) return x.status;
  if(/siap/i.test(x.tarikh)||/siap/i.test(x.intervensi||'')) return 'Selesai';
  const p=parseTarikh(x.tarikh);
  if(!p) return 'Belum Dijadualkan';
  const d=new Date(p.y,p.m,p.days[p.days.length-1]);
  return d<TODAY ? 'Selesai (perlu laporan)' : (p.tbc?'Dirancang (TBC)':'Dirancang');
}
function sesiBadge(st){
  const m={'Selesai':'b-good','Selesai (perlu laporan)':'b-warn','Dirancang':'b-info','Dirancang (TBC)':'b-info','Belum Dijadualkan':'b-neutral'};

}

/* ================= QUEUE / WORKFLOW ================= */
function mkQueue(modul, ref, tajuk, perubahan, oleh, status='Menunggu Semakan', tarikh){
  const q={id:'Q'+(uid++), modul, ref, tajuk, perubahan, oleh, status, tarikh: tarikh||nowStr(), ulasan:[]};
  DB.queue.unshift(q);
  const rec = findRec(modul, ref); if(rec) rec.wf = status;
  return q;
}
function findRec(modul, id){ const k={RKB:'rkb',PTP:'ptp',JRD:'jrd',KONV:'konv',ASET:'aset'}[modul]; return DB[k]?.find(x=>x.id===id); }
function applyQueue(q){
  const rec=findRec(q.modul,q.ref); if(!rec) return;
  if(q.perubahan.__baru){ rec.wf='Diluluskan'; return; }
  for(const [f,[o,n]] of Object.entries(q.perubahan)) rec[f]=n;
  rec.wf='Diluluskan';
  if(rec.hist) rec.hist.unshift({t:'Diluluskan: '+Object.keys(q.perubahan).join(', '), d:nowStr(), o:ROLES[S.role].nama});
}
function act(qid, kind){
  const q=DB.queue.find(x=>x.id===qid); if(!q) return;
  const ul = ($('#ul_'+qid)?.value||'').trim();
  const rec=findRec(q.modul,q.ref);
  if(kind==='pulang'){
    if(!ul){ toast('Sila nyatakan ulasan sebab dipulangkan.'); return; }
    q.status='Dipulangkan'; if(rec) rec.wf='Dipulangkan';
    q.ulasan.push({o:ROLES[S.role].nama, t:ul, d:nowStr()}); audit(`Pulangkan ${q.modul} "${q.tajuk.slice(0,50)}" kepada ${q.oleh}`);
    toast('Dipulangkan kepada '+q.oleh+' untuk pembetulan');
  } else if(kind==='semak'){
    q.status='Menunggu Kelulusan'; if(rec) rec.wf='Menunggu Kelulusan';
    if(ul) q.ulasan.push({o:ROLES[S.role].nama, t:ul, d:nowStr()}); audit(`Sahkan semakan ${q.modul} "${q.tajuk.slice(0,50)}"`);
    toast('Disahkan dan dimajukan kepada Pengarah');
  } else if(kind==='lulus'){
    q.status='Diluluskan'; applyQueue(q);
    if(ul) q.ulasan.push({o:ROLES[S.role].nama, t:ul, d:nowStr()}); audit(`Lulus ${q.modul} "${q.tajuk.slice(0,50)}"`);
    toast('Diluluskan. Rekod dikemas kini.');
  }
  render();
}

function ringCard(t,n,tot,c,on,sub){ const p=tot?Math.round(n/tot*100):0; return `<div class="ring-card" onclick="${on}"><div class="ring" data-p="${p}" style="--c:${c}"><b>${p}%</b></div><div><div class="t">${t}</div><div class="v">${n.toLocaleString('en-MY')}<span style="opacity:.55;font-size:13px;font-weight:600"> / ${tot.toLocaleString('en-MY')}</span></div><div class="s">${sub}</div></div></div>`; }
function statCard(ic,tint,tc,lbl,val,meta,on){ return `<div class="card stat" style="--tint:${tint};--tc:${tc}" onclick="${on}"><div class="ico">${svg(ic)}</div><div style="min-width:0"><div class="lbl">${lbl}</div><div class="val" ${typeof val==='number'?`data-count="${val}"`:''}>${val}</div><div class="meta">${meta}</div></div><span class="go">↗</span></div>`; }
function animateUI(){
  document.querySelectorAll('.ring[data-p]').forEach(el=>{ const tgt=+el.dataset.p; let v=0; const st=performance.now(); const f=(now)=>{ const k=Math.min(1,(now-st)/900); v=Math.round(tgt*(1-Math.pow(1-k,3))); el.style.setProperty('--p',v); el.querySelector('b').textContent=v+'%'; if(k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); });
  document.querySelectorAll('[data-count]').forEach(el=>{ const tgt=+el.dataset.count; const st=performance.now(); const f=(now)=>{ const k=Math.min(1,(now-st)/700); el.textContent=Math.round(tgt*(1-Math.pow(1-k,3))).toLocaleString('en-MY'); if(k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); });
  document.querySelectorAll('.kx .val, .kpi .val').forEach(el=>{ const m=el.firstChild&&el.firstChild.nodeType===3&&/^\d+$/.test(el.firstChild.textContent.trim())?el.firstChild:null; if(!m) return; const tgt=+m.textContent.trim(); const st=performance.now(); const f=(now)=>{ const k=Math.min(1,(now-st)/700); m.textContent=Math.round(tgt*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); });
}

function stageChart(compact){

function saveRkb(id){
  const fd = Object.fromEntries(new FormData($('#fRkb')).entries());
  const who = ROLES[S.role].nama.split(' ')[0];
  if(id){
    const x=DB.rkb.find(r=>r.id===id), ch={};
    ['tajuk','agensi','kaedah','status','pic','sijil','objektif','catatan'].forEach(f=>{ if((fd[f]??'')!==(x[f]??'')) ch[f]=[x[f],fd[f]]; });
    if(!Object.keys(ch).length){ toast('Tiada perubahan.'); return; }
    if(S.role==='admin'){ Object.entries(ch).forEach(([f,[o,n]])=>x[f]=n); x.hist.unshift({t:'Dikemas kini terus oleh Admin: '+Object.keys(ch).join(', '),d:nowStr(),o:who}); audit(`Kemas kini terus ${x.kod}`); toast('Disimpan.'); }
    else { mkQueue('RKB', id, x.kod+' · '+x.tajuk, ch, who); x.hist.unshift({t:'Perubahan dihantar untuk semakan',d:nowStr(),o:who}); audit(`Hantar perubahan ${x.kod} untuk semakan`); toast('Dihantar kepada Penyelia untuk semakan.'); }
  } else {
    const neg=fd.negeri, pre=neg==='Johor'?'JHR':'MLK', yy=fd.thn.slice(2);
    const n = DB.rkb.filter(r=>r.negeri===neg && r.kod.endsWith('_'+yy)).length+1;
    const rec={kod:`${pre}_${String(n).padStart(2,'0')}_${yy}`, negeri:neg, thn:fd.thn, siap:'', agensi:fd.agensi, tajuk:fd.tajuk, kaedah:fd.kaedah, objektif:fd.objektif, status:fd.status, sijil:fd.sijil, catatan:fd.catatan, pic:fd.pic, id:'R'+(uid++), wf:'Diluluskan', hist:[{t:'Rekod didaftarkan',d:nowStr(),o:who}]};
    DB.rkb.unshift(rec);
    if(S.role!=='admin'){ mkQueue('RKB', rec.id, rec.kod+' · '+rec.tajuk, {__baru:true}, who); toast(`${rec.kod} didaftarkan dan dihantar untuk semakan.`); } else toast(`${rec.kod} didaftarkan.`);
    audit(`Daftar projek baharu ${rec.kod}`);
  }
  closeLayer(); render();
}

function saveSesi(prog,id){
  const fd=Object.fromEntries(new FormData($('#fS')).entries()), list=prog==='PTP'?DB.ptp:DB.jrd, who=ROLES[S.role].nama.split(' ')[0];
  if(id){
    const x=list.find(i=>i.id===id), ch={};
    ['intervensi','lawatan','tarikh','pic','fasa'].forEach(f=>{ if(fd[f]!==undefined && fd[f]!==(x[f]||'')) ch[f]=[x[f],fd[f]]; });
    if(!Object.keys(ch).length){ toast('Tiada perubahan.'); return; }
    if(S.role==='admin'){ Object.entries(ch).forEach(([f,[o,n]])=>x[f]=n); toast('Disimpan.'); }
    else { mkQueue(prog,id,x.syarikat+' · '+(x.intervensi||x.lawatan),ch,who); toast('Dihantar untuk semakan.'); }
    audit(`Kemas kini ${prog} ${x.syarikat}`);
  } else {
    const rec={...fd, negeri:fd.negeri||'Johor', id:(prog==='PTP'?'P':'J')+(uid++), wf:'Diluluskan'};
    if(prog==='JRD'){ rec.fasa=fd.fasa; }
    list.push(rec);
    if(S.role!=='admin') mkQueue(prog,rec.id,rec.syarikat+' · '+(rec.intervensi||rec.lawatan),{__baru:true},who);
    audit(`Tambah ${prog} ${rec.syarikat}`); toast(S.role==='admin'?'Ditambah.':'Ditambah dan dihantar untuk semakan.');
  }
  closeLayer(); render();
}

PAGES.kalendar = () => {
  const m=S.calM, y=S.calY, first=new Date(y,m,1), start=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate();
  const ev={}; allSesi().forEach(x=>{ const p=parseTarikh(x.tarikh); if(p&&p.m===m&&p.y===y) p.days.forEach(d=>{ (ev[d]=ev[d]||[]).push({...x,tbc:p.tbc}); }); });
  const cells=[]; for(let i=0;i<start;i++) cells.push('<div class="dc out"></div>');
  for(let d=1;d<=days;d++){ const isT = d===TODAY.getDate()&&m===TODAY.getMonth()&&y===TODAY.getFullYear();

function lineChartSVG(years, series, fmt){
  const W=760,H=260,L=64,R=86,T=16,B=30, all=series.flatMap(s=>s.v), mn=Math.floor(Math.min(...all)/10000)*10000, mx=Math.ceil(Math.max(...all)/10000)*10000;
  const x=i=>L+i*(W-L-R)/(years.length-1), y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const ticks=[]; for(let v=mn; v<=mx; v+=(mx-mn)/4) ticks.push(v);
  let g=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8a94a6">${Math.round(v/1000)}k</text>`).join('');
  g+=years.map((yr,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8a94a6">${yr}</text>`).join('');
  series.forEach(s=>{ g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} points="${s.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
    g+=`<text x="${x(years.length-1)+10}" y="${y(s.v[s.v.length-1])+4}" font-size="12" font-weight="600" fill="#101828">${s.n}</text>`; });
  series.forEach(s=>s.v.forEach((v,i)=>{ g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===years.length-1?4.5:3}" fill="${s.dash?'#fff':s.c}" stroke="${s.c}" stroke-width="2"/>`; }));
  g+=years.map((yr,i)=>`<rect x="${x(i)-(W-L-R)/(years.length-1)/2}" y="${T}" width="${(W-L-R)/(years.length-1)}" height="${H-T-B}" fill="transparent" onmouseenter="tipOn(event,'<b>${yr}</b>${series.map(s=>s.n+': '+fmt(s.v[i])).join('<br>')}')" onmouseleave="tipOff()"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
}
function barChartSVG(years, series){
  const W=760,H=240,L=40,R=12,T=14,B=30, all=series.flatMap(s=>s.v.filter(v=>v!=null)), mx=Math.ceil(Math.max(...all,1)), mn=Math.floor(Math.min(...all,0));
  const n=years.length, bw=(W-L-R)/n, y=v=>T+(mx-v)/(mx-mn)*(H-T-B), gap=2, inner=Math.min(14,(bw-14)/series.length);
  let g=''; for(let v=mn; v<=mx; v+=2){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#98a2b3':'#eef0f3'}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8a94a6">${v}%</text>`; }
  years.forEach((yr,i)=>{ const cx=L+bw*i+bw/2, tw=series.length*inner+(series.length-1)*gap;
    series.forEach((s,j)=>{ const v=s.v[i]; if(v==null) return; const x0=cx-tw/2+j*(inner+gap), y0=y(Math.max(v,0)), h=Math.abs(y(v)-y(0));
      g+=`<rect x="${x0}" y="${y0}" width="${inner}" height="${Math.max(h,1)}" rx="2" fill="${s.c}"/>`; });
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8a94a6">${yr}</text>`;
    g+=`<rect x="${L+bw*i}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" onmouseenter="tipOn(event,'<b>${yr}</b>${series.map(s=>s.n+': '+(s.v[i]==null?'—':(s.v[i]>0?'+':'')+s.v[i]+'%')).join('<br>')}')" onmouseleave="tipOff()"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;

function niceLine(labels, series, fmtTip, fmtAxis, fmtEnd){
  const W=420,H=230,L=40,R=50,T=12,B=28, all=series.flatMap(s=>s.v);
  let lo=Math.min(...all), hi=Math.max(...all); const raw=(hi-lo)/4||1, mag=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const x=i=>L+i*(W-L-R)/(labels.length-1), y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g=''; for(let v=lo; v<=hi+1e-9; v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8a94a6">${fmtAxis(v)}</text>`;
  const every=labels.length>8?3:2;
  g+=labels.map((l,i)=>(labels.length-1-i)%every===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8a94a6">${l}</text>`:'').join('');
  series.forEach(s=>{ g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`; s.v.forEach((v,i)=>{ g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===s.v.length-1?4.5:3}" fill="${s.c}"/>`; });
    g+=`<text x="${x(s.v.length-1)+9}" y="${y(s.v[s.v.length-1])+4}" font-size="12" font-weight="600" fill="#101828">${(fmtEnd||fmtTip)(s.v[s.v.length-1])}</text>`; });
  g+=labels.map((l,i)=>`<rect x="${x(i)-(W-L-R)/(labels.length-1)/2}" y="${T}" width="${(W-L-R)/(labels.length-1)}" height="${H-T-B}" fill="transparent" onmouseenter="tipOn(event,'<b>${l}</b>${series.map(s=>(s.n?s.n+': ':'')+fmtTip(s.v[i])).join('<br>')}')" onmouseleave="tipOff()"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
}

function importAset(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    let rows;
    if(/\.json$/i.test(f.name)){ rows=JSON.parse(rd.result); if(!Array.isArray(rows)) rows=rows.data||rows.aset||[]; }
    else { rows=parseCsv(rd.result); }
    const pick=(o,keys)=>{ for(const k of Object.keys(o)){ const n=k.toLowerCase().replace(/[^a-z]/g,''); if(keys.includes(n)) return String(o[k]??'').trim(); } return ''; };
    const out=rows.map((o,i)=>{ const nama=pick(o,['nama','namakategori','namaaset','namakategoriaset','keterangan','keteranganaset']); if(!nama) return null;
      const st=pick(o,['status']); const no=pick(o,['noaset','nosiri','nosiripendaftaran','nombordaftar']);
      const tahun=pick(o,['tahun']);
      const a={id:'A'+(i+1), no:i+1, nama, noAset:(no==='-'?'':no), tahun:/^\d{4}$/.test(tahun)?tahun:'', lokasi:pick(o,['lokasi'])||'-', pic:pick(o,['pic'])||'-', status:(ASET_ST.find(s=>st.toLowerCase().startsWith(s.k.toLowerCase().slice(0,5)))||ASET_ST[0]).k, catatan:(x=>x==='-'?'':x)(pick(o,['catatan','lainlainnamakategori'])), tarikh:(pick(o,['tarikh','tarikhsurvei','timestamp'])||'').slice(0,10), gambar:((pick(o,['gambar','gambaraset']).match(/id=([\w-]+)/)||[])[1]||''), wf:'Diluluskan'};
      a.kat=classifyAset(a.nama,a.catatan); return a; }).filter(Boolean);
    if(!out.length){ toast('Tiada rekod sah dijumpai dalam fail.'); return; }
    const before=DB.aset.length; DB.aset=out;
    S.asSync=nowStr()+' ('+esc(f.name)+', '+out.length+' rekod)';
    audit(`Import data aset: ${out.length} rekod (sebelum ${before}) daripada ${f.name}`);
    toast(`${out.length} rekod aset diimport.`); render();
  }catch(e){ toast('Fail tidak dapat dibaca: '+e.message); } };
  rd.readAsText(f);
}
function parseCsv(txt){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cur); cur=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=c; }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  const h=rows.shift()||[]; return rows.filter(r=>r.some(v=>v.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k.replace(/^\uFEFF/,''),r[i]])));
}

  <div class="drawer-f" style="border-radius:0 0 14px 14px"><button class="btn" onclick="closeLayer()">Batal</button><button class="btn pri" onclick="document.getElementById('fA').requestSubmit()">${S.role==='admin'?'Simpan terus (Admin)':'Hantar untuk semakan'}</button></div></div></div>`);
}
function saveAset(id){
  const fd=Object.fromEntries(new FormData($('#fA')).entries()), who=ROLES[S.role].nama.split(' ')[0];
  if(id){
    const a=DB.aset.find(x=>x.id===id), ch={};
    ['noAset','tahun','lokasi','pic','status','catatan'].forEach(f=>{ if((fd[f]??'')!==(a[f]??'')) ch[f]=[a[f],fd[f]]; });
    if(!Object.keys(ch).length){ toast('Tiada perubahan.'); return; }
    if(S.role==='admin'){ Object.entries(ch).forEach(([f,[o,n]])=>a[f]=n); toast('Disimpan.'); }
    else { mkQueue('ASET', id, (a.nama==='LAIN-LAIN'&&a.catatan?a.catatan:a.nama)+' · '+(a.noAset||a.lokasi), ch, who); toast('Dihantar untuk semakan.'); }
    audit(`Kemas kini aset #${a.no}`);
  } else {
    const n=DB.aset.length+1, rec={id:'A'+n, no:n, nama:fd.nama.toUpperCase(), noAset:fd.noAset, tahun:fd.tahun, lokasi:fd.lokasi, pic:fd.pic, status:fd.status, catatan:fd.catatan, tarikh:'2026-11-13', wf:'Diluluskan'};
    rec.kat=classifyAset(rec.nama,rec.catatan); DB.aset.push(rec);
    if(S.role!=='admin') mkQueue('ASET', rec.id, rec.nama+' · '+rec.lokasi, {__baru:true}, who);
    audit(`Daftar aset baharu #${n}`); toast(S.role==='admin'?'Aset didaftarkan.':'Aset didaftarkan dan dihantar untuk semakan.');
  }
  closeLayer(); render();
}
function copyAset(){
  const xs=asetFiltered();
  const txt=['Bil\tNama Aset\tNo. Aset\tTahun\tLokasi\tPIC\tStatus\tKategori\tCatatan', ...xs.map((a,i)=>[i+1,a.nama,a.noAset,a.tahun,a.lokasi,a.pic,a.status,a.kat,a.catatan].join('\t'))].join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast(`${xs.length} rekod disalin. Tampal ke Excel.`)).catch(()=>toast('Pelayar tidak membenarkan salin.'));
}
function openKewPa7(lok){

  <div class="card-b"><div class="filters"><label style="font-weight:700;font-size:12px">Lokasi</label><select class="inp" style="flex:1" onchange="openKewPa7(this.value)"><option value="">— Pilih lokasi —</option>${L.map(o=>`<option ${lok===o?'selected':''}>${esc(o)}</option>`).join('')}</select>${lok?`<button class="btn sm" onclick="copyKew()">⧉ Salin</button>`:''}</div>
  ${lok?`<div id="kew" style="border:1px solid var(--line);border-radius:8px;padding:22px;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#000;font-size:12px">
    <div style="text-align:right;font-weight:700">KEW.PA-7</div>

    <div><b style="display:inline-block;width:80px">BAHAGIAN</b>: Malaysia Productivity Corporation (SRO)</div>
    <div style="margin-top:4px"><b style="display:inline-block;width:80px">LOKASI</b>: ${esc(lok)}</div>
    <table style="width:100%;border-collapse:collapse;margin-top:14px" id="kewTbl"><thead><tr>${['BIL','NO SIRI PENDAFTARAN','KETERANGAN ASET','KUANTITI'].map(h=>`<th style="border:1px solid #000;padding:5px 7px;background:#f0f0f0">${h}</th>`).join('')}</tr></thead><tbody>
    ${items.map((a,i)=>`<tr><td style="border:1px solid #000;padding:5px 7px;text-align:center">${i+1}</td><td style="border:1px solid #000;padding:5px 7px">${esc(a.noAset||'-')}</td><td style="border:1px solid #000;padding:5px 7px">${esc(a.nama)}${a.catatan?`<br><span style="color:#444;font-size:10.5px">${esc(a.catatan)}</span>`:''}</td><td style="border:1px solid #000;padding:5px 7px;text-align:center">1</td></tr>`).join('')}
    <tr><td colspan="3" style="border:1px solid #000;padding:5px 7px;font-weight:700;text-align:right">JUMLAH</td><td style="border:1px solid #000;padding:5px 7px;text-align:center;font-weight:700">${items.length}</td></tr></tbody></table>
    <div style="display:flex;gap:30px;margin-top:34px">${['Disediakan oleh','Disahkan oleh'].map(t=>`<div style="flex:1"><div style="margin-bottom:34px">${t}:</div><div style="border-bottom:1px solid #000;width:85%"></div><div style="margin-top:6px">Nama :</div><div style="margin-top:6px">Jawatan :</div><div style="margin-top:6px">Tarikh :</div></div>`).join('')}</div>
  </div><div class="muted" style="font-size:11.5px;margin-top:8px">Cetakan terus tidak tersedia dalam prototaip. Dalam sistem sebenar, borang ini dijana sebagai PDF.</div>`:'<div class="empty">Pilih lokasi untuk menjana borang KEW.PA-7.</div>'}
  </div></div></div>`);
}
function copyKew(){ const tb=$('#kewTbl'); const txt=[...tb.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.innerText.replace(/\s+/g,' ').trim()).join('\t')).join('\n'); navigator.clipboard.writeText(txt).then(()=>toast('Senarai disalin.')).catch(()=>toast('Pelayar tidak membenarkan salin.')); }

/* ---- SEMAKAN ---- */
PAGES.semakan = () => {
  const r=S.role;
  const aktif = DB.queue.filter(q=>/Menunggu/.test(q.status));
  const list = S.queueTab==='aktif' ? aktif : DB.queue.filter(q=>!/Menunggu/.test(q.status));
  const mine = q => (r==='penyelia'&&q.status==='Menunggu Semakan')||(r==='pengarah'&&q.status==='Menunggu Kelulusan')||(r==='admin'&&/Menunggu/.test(q.status));
  return `
  <div class="page-h"><div><h1>Semakan &amp; Kelulusan</h1><p>Aliran kerja: PIC hantar, Penyelia semak, Pengarah lulus. Rekod yang dipulangkan kembali kepada PIC untuk pembetulan.</p></div></div>
  <div class="card" style="margin-bottom:16px"><div class="card-b" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:600">
    ${['PIC hantar','Menunggu Semakan','Penyelia sahkan','Menunggu Kelulusan','Pengarah lulus','Diluluskan'].map((s,i)=>`<span class="badge ${i%2?(i===5?'b-good':i===1?'b-warn':'b-info'):'b-neutral'}" style="${(r==='penyelia'&&i===2)||(r==='pengarah'&&i===4)?'outline:2px solid var(--gold)':''}">${s}</span>${i<5?'<span class="muted">→</span>':''}`).join('')}
    <span class="muted" style="margin-left:12px">atau ↩ Dipulangkan kepada PIC</span></div></div>
  <div class="tabs" style="margin-bottom:12px"><button class="${S.queueTab==='aktif'?'on':''}" onclick="S.queueTab='aktif';render()">Aktif (${aktif.length})</button><button class="${S.queueTab!=='aktif'?'on':''}" onclick="S.queueTab='selesai';render()">Selesai / dipulangkan</button></div>
  ${list.length? list.map(q=>`<div class="card" style="margin-bottom:12px"><div class="card-h"><span class="badge ${q.modul==='RKB'?'b-info':'b-gold'}">${q.modul}</span><h3 style="flex:1">${esc(q.tajuk)}</h3>${wfBadge(q.status)}</div>
    <div class="card-b"><div class="muted" style="font-size:12px">Dihantar oleh <b>${esc(q.oleh)}</b> · ${esc(q.tarikh)}</div>${diffHtml(q.perubahan)}
    ${q.ulasan.map(u=>`<div style="font-size:12.5px;margin-top:6px;background:#fafbfc;border-radius:8px;padding:6px 10px">💬 <b>${esc(u.o)}</b>: ${esc(u.t)}</div>`).join('')}
    ${mine(q)?`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input class="inp" id="ul_${q.id}" style="flex:1;min-width:220px" placeholder="Ulasan (wajib jika dipulangkan)">
      <button class="btn no" onclick="act('${q.id}','pulang')">↩ Pulangkan</button>
      ${q.status==='Menunggu Semakan'&&(r==='penyelia'||r==='admin')?`<button class="btn ok" onclick="act('${q.id}','semak')">✓ Sahkan semakan</button>`:''}
      ${q.status==='Menunggu Kelulusan'&&(r==='pengarah'||r==='admin')?`<button class="btn gold" onclick="act('${q.id}','lulus')">✓ Luluskan</button>`:''}
      <button class="btn" onclick="${q.modul==='RKB'?`openRkb('${q.ref}')`:q.modul==='ASET'?`openAset('${q.ref}')`:`openSesi('${q.modul}','${q.ref}')`}">Lihat rekod</button></div>`:(/Menunggu/.test(q.status)?`<div class="muted" style="font-size:12px;margin-top:10px">Menunggu tindakan ${q.status==='Menunggu Semakan'?'Penyelia':'Pengarah'}.</div>`:'')}
    </div></div>`).join('') : '<div class="card empty">Tiada rekod.</div>'}`;
};
PAGES.hantaran = () => {
  const me=ROLES.pegawai.nama.split(' ')[0];
  const xs=DB.queue.filter(q=>q.oleh===me);
  return `<div class="page-h"><div><h1>Hantaran Saya</h1><p>Status perubahan yang anda hantar untuk semakan dan kelulusan.</p></div></div>
  ${xs.length?xs.map(q=>`<div class="card" style="margin-bottom:12px"><div class="card-h"><span class="badge ${q.modul==='RKB'?'b-info':'b-gold'}">${q.modul}</span><h3 style="flex:1">${esc(q.tajuk)}</h3>${wfBadge(q.status)}</div><div class="card-b"><div class="muted" style="font-size:12px">${esc(q.tarikh)}</div>${diffHtml(q.perubahan)}${q.ulasan.map(u=>`<div style="font-size:12.5px;margin-top:6px;background:#fafbfc;border-radius:8px;padding:6px 10px">💬 <b>${esc(u.o)}</b>: ${esc(u.t)}</div>`).join('')}${q.status==='Dipulangkan'&&q.modul==='RKB'?`<button class="btn pri sm" style="margin-top:10px" onclick="openRkbForm('${q.ref}')">Betulkan &amp; hantar semula</button>`:''}</div></div>`).join(''):'<div class="card empty">Anda belum menghantar sebarang perubahan. Cuba kemas kini satu projek RKB.</div>'}`;
};

/* ---- LAPORAN ---- */
PAGES.laporan = () => {
  const t=S.rpt, n=S.rptNeg;
  const R = {rkb:'Ringkasan Status Projek RKB', konv:'Laporan Konvensyen RKB 2026', prog:'Status Program PTP & JRD', tert:'Tindakan Tertangguh'};
  return `
  <div class="page-h"><div><h1>Laporan Pengurusan</h1><p>Jana laporan mengikut negeri. Salin ke Excel atau e-mel.</p></div></div>
  <div class="card" style="margin-bottom:16px"><div class="card-b filters" style="margin:0">
    <select class="inp" onchange="S.rpt=this.value;render()">${Object.entries(R).map(([k,v])=>`<option value="${k}" ${t===k?'selected':''}>${v}</option>`).join('')}</select>
    <select class="inp" onchange="S.rptNeg=this.value;render()">${['Semua','Johor','Melaka'].map(x=>`<option ${n===x?'selected':''}>${x}</option>`).join('')}</select>
    <span style="flex:1"></span>
    <button class="btn" onclick="copyReport()">⧉ Salin jadual (untuk Excel)</button>
  </div></div>
  <div class="card" id="rptBody"><div class="card-b">
    <div style="display:flex;align-items:flex-start;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:16px"><div class="brand-mark" style="width:38px;height:38px">SRO</div><div style="flex:1"><div class="muted" style="font-size:11px;letter-spacing:1px;text-transform:uppercase">MPC Wilayah Selatan · SCOPE</div><h2 style="margin:2px 0 0;font-size:18px">${R[t]}</h2><div class="muted" style="font-size:12px">Negeri: ${n} · Dijana ${nowStr()} oleh ${esc(ROLES[S.role].nama)}</div></div></div>
    ${reportBody(t,n)}
  </div></div>`;
};
function reportBody(t,n){
  const f = x => n==='Semua'||x.negeri===n;
  if(t==='rkb'){
    const xs=DB.rkb.filter(f);
    return `<table class="t" id="rptTbl"><thead><tr><th>Peringkat</th><th style="text-align:right">Johor</th><th style="text-align:right">Melaka</th><th style="text-align:right">Jumlah</th><th style="text-align:right">%</th></tr></thead><tbody>${STAGES.map(s=>{ const a=xs.filter(x=>x.negeri==='Johor'&&stageOf(x.status).k===s.k).length, b=xs.filter(x=>x.negeri==='Melaka'&&stageOf(x.status).k===s.k).length; return a+b?`<tr><td>${stagePill(s.k)}</td><td style="text-align:right">${a}</td><td style="text-align:right">${b}</td><td style="text-align:right;font-weight:700">${a+b}</td><td style="text-align:right">${Math.round((a+b)/xs.length*100)}%</td></tr>`:''; }).join('')}<tr><td><b>Jumlah</b></td><td style="text-align:right"><b>${xs.filter(x=>x.negeri==='Johor').length}</b></td><td style="text-align:right"><b>${xs.filter(x=>x.negeri==='Melaka').length}</b></td><td style="text-align:right"><b>${xs.length}</b></td><td style="text-align:right">100%</td></tr></tbody></table>
    <div class="sec-t">Mengikut kaedah</div><table class="t"><tbody>${[...KAEDAH,''].map(k=>{ const c=xs.filter(x=>x.kaedah===k).length; return c?`<tr><td>${k||'Tidak dinyatakan'}</td><td style="text-align:right;font-weight:600">${c}</td></tr>`:''; }).join('')}</tbody></table>`;
  }
  if(t==='konv'){
    const xs=DB.konv.filter(f).filter(k=>k.lengkap).sort((a,b)=>(b.kos||0)-(a.kos||0));
    return `<table class="t" id="rptTbl"><thead><tr><th>#</th><th>Jabatan</th><th>Projek</th><th>Ketua</th><th style="text-align:right">Penjimatan (RM)</th></tr></thead><tbody>${xs.map((k,i)=>`<tr><td>${i+1}</td><td>${esc(k.jabatan)}</td><td>${esc(k.projek)}</td><td>${esc(k.ketua)}</td><td style="text-align:right">${k.kos?Math.round(k.kos).toLocaleString('en-MY'):'—'}</td></tr>`).join('')}<tr><td></td><td colspan="3"><b>Jumlah (${xs.length} kumpulan lengkap)</b></td><td style="text-align:right"><b>${Math.round(xs.reduce((a,k)=>a+(k.kos||0),0)).toLocaleString('en-MY')}</b></td></tr></tbody></table>`;
  }
  if(t==='prog'){
    const xs=allSesi().filter(f);
    return `<table class="t" id="rptTbl"><thead><tr><th>Program</th><th>Syarikat</th><th>Negeri</th><th>Intervensi / Lawatan</th><th>Tarikh</th><th>PIC</th><th>Status</th></tr></thead><tbody>${xs.map(x=>`<tr><td>${x.prog}</td><td>${esc(x.syarikat)}</td><td>${x.negeri}</td><td>${esc(x.label)}</td><td>${esc(x.tarikh||'—')}</td><td>${esc(x.pic||'—')}</td><td>${esc(sesiStatus(x))}</td></tr>`).join('')}</tbody></table>`;
  }
  const items=[];
  DB.rkb.filter(f).forEach(x=>{ if(!x.pic&&!['Gugur','Siap (100%)'].includes(x.status)) items.push(['RKB',x.kod,x.tajuk.slice(0,60),'PIC MPC belum ditetapkan']); if(x.status==='Belum Dikemas Kini') items.push(['RKB',x.kod,x.tajuk.slice(0,60),'Status pelaksanaan kosong']); });
  allSesi().filter(f).forEach(x=>{ const s=sesiStatus(x); if(s==='Selesai (perlu laporan)') items.push([x.prog,x.syarikat,x.label,'Laporan sesi belum dimuat naik']); if(s==='Belum Dijadualkan') items.push([x.prog,x.syarikat,x.label,'Tarikh belum ditetapkan']); });
  DB.queue.filter(q=>/Menunggu/.test(q.status)).forEach(q=>items.push([q.modul,'Kelulusan',q.tajuk.slice(0,60),q.status]));
  return `<table class="t" id="rptTbl"><thead><tr><th>Modul</th><th>Rujukan</th><th>Perkara</th><th>Tindakan diperlukan</th></tr></thead><tbody>${items.map(i=>`<tr>${i.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="muted" style="margin-top:8px;font-size:12px">${items.length} perkara</div>`;
}
function copyReport(){
  const tb=$('#rptTbl'); if(!tb) return;
  const txt=[...tb.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.innerText.replace(/\s+/g,' ').trim()).join('\t')).join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('Jadual disalin. Tampal terus ke Excel.')).catch(()=>toast('Pelayar tidak membenarkan salin. Pilih jadual dan salin secara manual.'));
}

/* ---- ADMIN ---- */
PAGES.admin = () => {
  const t=S.adminTab;
  const tabs={pengguna:'Pengguna',peranan:'Matriks Peranan',rujukan:'Data Rujukan',audit:'Log Audit',kualiti:'Kualiti Data'};
  let body='';
  if(t==='pengguna') body=`<table class="t"><thead><tr><th>Nama</th><th>Peranan</th><th>Unit</th><th>Status</th><th></th></tr></thead><tbody>${DB.users.map((u,i)=>`<tr><td><b>${esc(u.nama)}</b></td><td><select class="inp" style="padding:4px 8px" onchange="DB.users[${i}].peranan=this.value;audit('Tukar peranan ${esc(u.nama)} → '+this.value);toast('Peranan dikemas kini')">${['Pegawai (PIC)','Penyelia','Pengarah','Admin'].map(p=>`<option ${u.peranan===p?'selected':''}>${p}</option>`).join('')}</select></td><td>${esc(u.unit)}</td><td>${u.aktif?'<span class="badge b-good">Aktif</span>':'<span class="badge b-neutral">Tidak aktif</span>'}</td><td><button class="btn sm" onclick="DB.users[${i}].aktif=!DB.users[${i}].aktif;audit('Tukar status akaun ${esc(u.nama)}');render()">${u.aktif?'Nyahaktif':'Aktifkan'}</button></td></tr>`).join('')}</tbody></table>`;
  if(t==='peranan'){ const rows=[['Lihat papan pemuka & modul teras',1,1,1,1],['Daftar / kemas kini rekod',1,0,0,1],['Hantar untuk semakan',1,0,0,0],['Semak & pulangkan rekod',0,1,0,1],['Luluskan rekod',0,0,1,1],['Jana & salin laporan',0,1,1,1],['Lihat kualiti data',0,1,1,1],['Padam rekod',0,0,0,1],['Urus pengguna, peranan & data rujukan',0,0,0,1],['Lihat log audit',0,0,0,1]];
    body=`<table class="t matrix"><thead><tr><th>Fungsi</th><th>Pegawai</th><th>Penyelia</th><th>Pengarah</th><th>Admin</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td>${v?'<span class="yes">✓</span>':'<span class="no-">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
  if(t==='rujukan') body=`<div class="grid g3">${[['Peringkat RKB',STAGES.slice(0,6).map(s=>s.s+(s.p!=null?' ('+s.p+'%)':''))],['Kaedah RKB',KAEDAH],['Jenis intervensi PTP',['Gemba 1','Gemba 2','Gemba 3','Training 1','Training 2']],['Fasa JRD',['Fasa 1: Diagnosis & Reka Bentuk','Fasa 2: Pelaksanaan & Pengukuran']],['Negeri',['Johor','Melaka']],['Pegawai PIC',PEGAWAI]].map(([h,l])=>`<div style="border:1px solid var(--line);border-radius:10px;padding:12px"><div style="display:flex"><b style="flex:1">${h}</b><button class="btn sm" onclick="toast('Tambah nilai (prototaip)')">+</button></div>${l.map(v=>`<div style="padding:5px 0;border-bottom:1px solid var(--line-2);font-size:12.5px">${esc(v)}</div>`).join('')}</div>`).join('')}</div>`;
  if(t==='audit') body=`<table class="t"><thead><tr><th>Masa</th><th>Pengguna</th><th>Tindakan</th></tr></thead><tbody>${DB.audit.map(a=>`<tr><td class="mono">${esc(a.t)}</td><td>${esc(a.o)}</td><td>${esc(a.a)}</td></tr>`).join('')}</tbody></table>`;
  if(t==='kualiti') body=dataQuality().map(d=>`<div class="li"><span class="badge ${d.n?'b-warn':'b-good'}" style="min-width:38px;justify-content:center">${d.n}</span><div style="flex:1"><div class="tt">${d.t}</div><div class="ss">${d.s}</div></div></div>`).join('') + `<p class="muted" style="font-size:12px">Senarai ini membantu proses pembersihan data sebelum migrasi (BRS S13).</p>`;
  return `<div class="page-h"><div><h1>Pentadbiran Sistem</h1><p>Akses penuh: pengguna, peranan, data rujukan dan jejak audit.</p></div></div>
  <div class="tabs" style="margin-bottom:14px">${Object.entries(tabs).map(([k,v])=>`<button class="${t===k?'on':''}" onclick="S.adminTab='${k}';render()">${v}</button>`).join('')}</div>
  <div class="card"><div class="card-b">${body}</div></div>`;
};

login('admin');
